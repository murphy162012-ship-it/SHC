
name: Build SHC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build SHC
        run: gradle -p SHC-GitHub-Build/shc-gh build --no-daemon

      - name: Upload SHC JAR
        uses: actions/upload-artifact@v4
        with:
          name: SHC-build
          path: SHC-GitHub-Build/shc-gh/build/libs/*.jar
